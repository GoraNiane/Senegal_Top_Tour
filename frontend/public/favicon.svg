  <path d="M37 24 L44 51" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.9" />
  <path d="M63 24 L56 51" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.9" />
  <path d="M26 34 L38 51" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.9" />
  <path d="M74 34 L62 51" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.9" />
  <path d="M20 47 L33 51" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.8" />
  <path d="M80 47 L67 51" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.8" />

