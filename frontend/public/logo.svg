<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Semicircle sun fan dome -->
  <path
    d="M50 15 C30 15 14 31 14 52 L86 52 C86 31 70 15 50 15 Z"
    fill="url(#goldSunGrad)"
  />
  <!-- Radiating sun ray lines in dome -->
  <path d="M50 16 L50 52" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.85" />
  <path d="M36 21 L44 52" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85" />
  <path d="M64 21 L56 52" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85" />
  <path d="M24 33 L38 52" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85" />
  <path d="M76 33 L62 52" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85" />
  <path d="M17 48 L32 52" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.75" />
  <path d="M83 48 L68 52" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Central Baobab tree silhouette inside dome -->
  <path
    d="M48 52 L48 40 C44 38 42 34 44 30 C46 26 54 26 56 30 C58 34 56 38 52 40 L52 52 Z"
    fill="#173C32"
  />

  <!-- Golden Field / Horizon / Pirogue curves below -->
