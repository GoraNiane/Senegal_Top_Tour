    d="M14 56 C28 56 46 62 50 78 C54 62 72 56 86 56 C74 76 58 84 50 84 C42 84 26 76 14 56 Z"
    fill="url(#goldBaseGrad)"
  />
  <path d="M14 56 C32 60 48 66 50 84" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.65" />
  <path d="M86 56 C68 60 52 66 50 84" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.65" />
  <path d="M30 64 C42 68 48 74 50 84" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.55" />
  <path d="M70 64 C58 68 52 74 50 84" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.55" />

  <defs>
    <linearGradient id="goldSunGrad" x1="50" y1="15" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D28A" />
      <stop offset="0.5" stop-color="#E2B167" />
      <stop offset="1" stop-color="#C99A4A" />
    </linearGradient>
    <linearGradient id="goldBaseGrad" x1="50" y1="56" x2="50" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2B167" />
      <stop offset="0.6" stop-color="#C99A4A" />
      <stop offset="1" stop-color="#8A5A23" />
    </linearGradient>
